# Netlify build settings for himavanthkarpurapu.com (served at the site root).
# GitHub Pages ignores this file; Pages uses .github/workflows/deploy-pages.yml.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback (harmless with hash routing; future-proofs any deep links).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
