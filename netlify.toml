# Netlify build settings for the 3D portfolio (served at the site root).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback (harmless with hash routing; future-proofs any deep links).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
